; Laravel queue worker — /etc/supervisor/conf.d/laravel-queue.conf
;
; CallPro-гийн webhook хүлээж авмагц ажлыг дараалалд хийгээд 200 буцаадаг.
; Энэ worker ажиллахгүй бол хүсэлт амжилттай хүлээж авагдана ЧБОЛОВЧ дуудлага
; хэзээ ч боловсруулагдахгүй — жагсаалт хоосон, мэдэгдэл ирэхгүй байна.
;
; Мөн Social webhook, мэдэгдэл, имэйл зэрэг өмнөх функцууд ч үүнээс хамаарна.
;
; Суулгах:
;   sudo cp deploy/supervisor-queue.conf /etc/supervisor/conf.d/laravel-queue.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
;
; Шалгах:  sudo supervisorctl tail -f laravel-queue

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --tries=3 --backoff=10 --max-time=3600 --sleep=1 --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
; Хоёр процесс: нэг нь удаан ажил хийж байхад нөгөө нь дуудлага боловсруулна
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-queue.log
stdout_logfile_maxbytes=10MB
; Deploy үед ажил дундуур таслахгүй — дуусахыг нь хүлээнэ
stopwaitsecs=3600
